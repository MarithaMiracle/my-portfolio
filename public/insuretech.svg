<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <rect width="1440" height="900" fill="#0B1220"/>
  <!-- top bar -->
  <rect width="1440" height="64" fill="#111827"/>
  <rect y="64" width="1440" height="1" fill="#1F2937"/>
  <circle cx="40" cy="32" r="8" fill="#F87171"/>
  <circle cx="64" cy="32" r="8" fill="#FBBF24"/>
  <circle cx="88" cy="32" r="8" fill="#34D399"/>
  <text x="120" y="38" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">InsureTech API — Swagger UI</text>
  <rect x="1180" y="18" width="220" height="28" rx="6" fill="#164E63"/>
  <text x="1210" y="37" fill="#A5F3FC" font-family="ui-monospace, monospace" font-size="13">OpenAPI 3.0</text>

  <!-- sidebar -->
  <rect y="65" width="280" height="835" fill="#0F172A"/>
  <rect x="280" y="65" width="1" height="835" fill="#1F2937"/>
  <text x="28" y="110" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="13">MODULES</text>
  <text x="28" y="150" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="16">plans</text>
  <text x="28" y="185" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="16">policies</text>
  <text x="28" y="220" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="16">pending-policies</text>
  <text x="28" y="255" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="16">products</text>
  <text x="28" y="290" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="16">users</text>
  <text x="28" y="340" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="13">STACK</text>
  <text x="28" y="375" fill="#ADB7BE" font-family="ui-monospace, monospace" font-size="14">NestJS · TypeScript</text>
  <text x="28" y="400" fill="#ADB7BE" font-family="ui-monospace, monospace" font-size="14">PostgreSQL · Sequelize</text>
  <text x="28" y="425" fill="#ADB7BE" font-family="ui-monospace, monospace" font-size="14">Swagger · Jest</text>

  <!-- main -->
  <text x="320" y="120" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="28" font-weight="700">Insurance plans, policies &amp; wallets</text>
  <text x="320" y="155" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="15">Documented REST API with modular domain services</text>

  <!-- endpoint cards -->
  <rect x="320" y="190" width="1040" height="72" rx="12" fill="#111827" stroke="#1F2937"/>
  <rect x="340" y="210" width="70" height="32" rx="6" fill="#065F46"/>
  <text x="355" y="231" fill="#A7F3D0" font-family="ui-monospace, monospace" font-size="14" font-weight="700">POST</text>
  <text x="430" y="231" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="16">/plans</text>
  <text x="560" y="231" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="14">Purchase plan · wallet deduction</text>

  <rect x="320" y="280" width="1040" height="72" rx="12" fill="#111827" stroke="#1F2937"/>
  <rect x="340" y="300" width="70" height="32" rx="6" fill="#1D4ED8"/>
  <text x="358" y="321" fill="#BFDBFE" font-family="ui-monospace, monospace" font-size="14" font-weight="700">GET</text>
  <text x="430" y="321" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="16">/policies</text>
  <text x="580" y="321" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="14">List policies by user or plan</text>

  <rect x="320" y="370" width="1040" height="72" rx="12" fill="#111827" stroke="#1F2937"/>
  <rect x="340" y="390" width="70" height="32" rx="6" fill="#9A3412"/>
  <text x="357" y="411" fill="#FED7AA" font-family="ui-monospace, monospace" font-size="14" font-weight="700">PATCH</text>
  <text x="430" y="411" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="16">/policies/{'{'}id{'}'}/activate</text>
  <text x="760" y="411" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="14">Activate one policy per plan</text>

  <rect x="320" y="460" width="1040" height="72" rx="12" fill="#111827" stroke="#1F2937"/>
  <rect x="340" y="480" width="70" height="32" rx="6" fill="#1D4ED8"/>
  <text x="358" y="501" fill="#BFDBFE" font-family="ui-monospace, monospace" font-size="14" font-weight="700">GET</text>
  <text x="430" y="501" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="16">/users/{'{'}id{'}'}/wallet</text>
  <text x="700" y="501" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="14">Wallet balance tracking</text>

  <!-- code panel -->
  <rect x="320" y="560" width="1040" height="280" rx="12" fill="#020617" stroke="#1F2937"/>
  <text x="350" y="600" fill="#64748B" font-family="ui-monospace, monospace" font-size="14">// NestJS module example</text>
  <text x="350" y="640" fill="#C084FC" font-family="ui-monospace, monospace" font-size="15">@Module</text>
  <text x="430" y="640" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">({'{'}</text>
  <text x="370" y="675" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="15">controllers</text>
  <text x="490" y="675" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">: [PlansController],</text>
  <text x="370" y="710" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="15">providers</text>
  <text x="470" y="710" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">: [PlansService],</text>
  <text x="370" y="745" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="15">imports</text>
  <text x="450" y="745" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">: [SequelizeModule.forFeature([Plan])]</text>
  <text x="350" y="780" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="15">{'}'})</text>
  <text x="350" y="815" fill="#34D399" font-family="ui-monospace, monospace" font-size="14">✓ Jest unit + e2e coverage</text>
</svg>
